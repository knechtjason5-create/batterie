<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Batterie</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#212121">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Batterie">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icone-192.png">
<link rel="manifest" href="./manifest.webmanifest">
<script>
  // Ouvert depuis l'écran d'accueil : on va directement à l'interface.
  var SITE = 'https://sites.google.com/view/coursdebatterie';
  var app = (window.navigator.standalone === true) ||
    (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
  if (app) location.replace(SITE);
</script>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #212121; color: #f2f2f2;
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 24px 16px; }
  main { max-width: 380px; text-align: center; }
  img { width: 128px; height: 128px; border-radius: 28px; box-shadow: 0 10px 30px rgba(0,0,0,.45); }
  h1 { font-size: 26px; margin: 20px 0 6px; }
  p { color: #b4b4ba; margin: 0 0 22px; }
  ol { text-align: left; background: #2c2c2e; border-radius: 16px; padding: 16px 16px 16px 36px; margin: 0 0 22px; }
  li { margin: 6px 0; }
  a.btn { display: block; background: #f2f2f2; color: #212121; text-decoration: none; font-weight: 700;
    border-radius: 14px; padding: 15px; }
</style>
</head>
<body>
<main>
  <img src="./icone-512.png" alt="">
  <h1>Cours de batterie</h1>
  <p>Ajoute l'application sur ton écran d'accueil :</p>
  <ol>
    <li>Touche le bouton <b>Partager</b> (carré avec une flèche).</li>
    <li>Choisis <b>« Sur l'écran d'accueil »</b>.</li>
    <li>Touche <b>Ajouter</b>.</li>
  </ol>
  <a class="btn" href="https://sites.google.com/view/coursdebatterie">Ouvrir l'interface</a>
</main>
</body>
</html>
